name: S2Arm Resource Pack - Google Drive

on:
  workflow_dispatch:
    inputs:
      s2arm_ref:
        description: "S2Arm upstream branch, tag, or ref"
        required: true
        default: "main"
        type: string
      title_id:
        description: "Optional 16-character base-game title ID (hex)"
        required: false
        type: string
      game_name:
        description: "Optional output name"
        required: false
        type: string
      upload_artifact:
        description: "Upload resource pack to this PUBLIC repository's Actions artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: s2arm-resource-pack-google-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      S2ARM_REF: ${{ inputs.s2arm_ref }}
      TITLE_ID: ${{ inputs.title_id }}
      GAME_NAME: ${{ inputs.game_name }}
      S2A_BEAT_S: "30"

    steps:
      - name: Check out S2action
        uses: actions/checkout@v4

      - name: Check runner and disk
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          df -h /

      - name: Install and select Bash 5
        shell: bash
        run: |
          set -euo pipefail
          brew install bash
          BASH_PREFIX="$(brew --prefix bash)"
          BASH_BIN="$BASH_PREFIX/bin/bash"
          test -x "$BASH_BIN"
          BASH_MAJOR="$("$BASH_BIN" -c 'printf "%s" "${BASH_VERSINFO[0]}"')"
          if [[ "$BASH_MAJOR" -lt 5 ]]; then
            echo "::error::Expected Bash 5 or newer, got $("$BASH_BIN" --version | head -n 1)"
            exit 1
          fi
          echo "$(dirname "$BASH_BIN")" >> "$GITHUB_PATH"
          echo "S2A_BASH=$BASH_BIN" >> "$GITHUB_ENV"
          echo "Selected $("$BASH_BIN" --version | head -n 1)"

      - name: Select Xcode 27.2
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_27.2.app"
          if [[ ! -d "$XCODE_APP/Contents/Developer" ]]; then
            echo "::error::Xcode 27.2 is not installed at $XCODE_APP"
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          ACTUAL_VERSION="$(xcodebuild -version | head -n 1)"
          echo "$ACTUAL_VERSION"
          [[ "$ACTUAL_VERSION" == "Xcode 27.2" ]] || { echo "::error::Expected Xcode 27.2"; exit 1; }

      - name: Clone S2Arm upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch "$S2ARM_REF" https://github.com/jhaizhou-ops/S2Arm.git "$RUNNER_TEMP/S2Arm"
          echo "S2ARM_DIR=$RUNNER_TEMP/S2Arm" >> "$GITHUB_ENV"

      - name: Set up Python and .NET
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || brew install zstd
          python -m pip install --upgrade pip gdown
          python -m pip install -r "$S2ARM_DIR/launchers/macos/requirements-runtime.txt" -r "$S2ARM_DIR/pack/fonts/requirements.txt"

      - name: Verify Xcode and Metal
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
          dotnet --list-sdks
          python --version
          zstd --version

      - name: Download Google Drive inputs
        shell: bash
        env:
          Game_URL: ${{ secrets.Game_URL }}
          Keys_URL: ${{ secrets.Keys_URL }}
          Update_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          DLC2_URL: ${{ secrets.DLC2_URL }}
        run: |
          set -euo pipefail
          python scripts/prepare_inputs.py "$RUNNER_TEMP/s2a-inputs"
          echo "S2A_INPUT_DIR=$RUNNER_TEMP/s2a-inputs/games" >> "$GITHUB_ENV"
          echo "S2A_KEYS_FILE=$RUNNER_TEMP/s2a-inputs/prod.keys" >> "$GITHUB_ENV"

      - name: Build and verify resource pack
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_resource_pack.py --upstream "$S2ARM_DIR" --input "$S2A_INPUT_DIR" --keys "$S2A_KEYS_FILE" --output "$RUNNER_TEMP/s2a-output" --title-id "$TITLE_ID" --game-name "$GAME_NAME"

      - name: Collect and print build diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/s2a-output"
          DIAG_DIR="$RUNNER_TEMP/s2a-diagnostics"
          LOG_DIR="$OUTPUT_DIR/build/logs"
          mkdir -p "$DIAG_DIR"

          if [[ -d "$LOG_DIR" ]]; then
            cp -R "$LOG_DIR" "$DIAG_DIR/build-logs"
          else
            echo "No upstream build log directory found at: $LOG_DIR"
          fi

          if [[ -f "$OUTPUT_DIR/events.jsonl" ]]; then
            cp "$OUTPUT_DIR/events.jsonl" "$DIAG_DIR/events.jsonl"
          fi

          REFRESH_LOG="$LOG_DIR/refresh.log"
          if [[ -f "$REFRESH_LOG" ]]; then
            echo "::group::S2Arm refresh.log (last 300 lines)"
            tail -n 300 "$REFRESH_LOG"
            echo "::endgroup::"
          else
            echo "refresh.log was not generated."
            if [[ -d "$LOG_DIR" ]]; then
              find "$LOG_DIR" -maxdepth 2 -type f -print
            fi
          fi

          echo "Diagnostic files staged under: $DIAG_DIR"

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: S2Arm-build-diagnostics-google-${{ github.run_number }}
          path: ${{ runner.temp }}/s2a-diagnostics/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 3

      - name: Upload resource pack artifact
        if: ${{ success() && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: S2Arm-resource-pack-google-${{ github.run_number }}
          path: ${{ steps.build.outputs.pack_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Final disk report
        if: always()
        run: df -h /
